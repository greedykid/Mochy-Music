name: CI & Optimized APK Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: APK build mode
        type: choice
        default: optimized
        options:
          - optimized
          - preview
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  build_optimized:
    name: ${{ matrix.build_type }} ${{ matrix.abi }} GMS APK
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.mode == 'preview' && '[{"abi":"arm64","variant":"Arm64","build_type":"Fast","output_type":"fast"}]' || '[{"abi":"universal","variant":"Universal","build_type":"Optimized","output_type":"optimized"},{"abi":"arm64","variant":"Arm64","build_type":"Optimized","output_type":"optimized"}]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools platforms;android-37.0 ndk;27.0.12077973
          log-accepted-android-sdk-licenses: false

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore persistent debug signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DRIZZY_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE" ]; then
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK and run applicable tests
        env:
          ABI_VARIANT: ${{ matrix.variant }}
          BUILD_TYPE: ${{ matrix.build_type }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
        shell: bash
        run: |
          task_args=(":app:assemble${ABI_VARIANT}Gms${BUILD_TYPE}")
          if [ "$ABI_VARIANT" = "Universal" ] && [ "$BUILD_TYPE" = "Optimized" ]; then
            task_args=(":app:testUniversalGmsDebugUnitTest" --tests "com.mochyy.mochymusic.ui.player.drizzy.DrizzyDesignTest" --tests "com.mochyy.mochymusic.ui.player.flow.*Test" "${task_args[@]}")
          fi
          ./gradlew "${task_args[@]}" -Pkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx5g -XX:+UseParallelGC -Dfile.encoding=UTF-8" --no-parallel --max-workers=2 --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload APK and available build reports
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.output_type }}-${{ matrix.abi }}
          path: |
            app/build/outputs/apk/${{ matrix.abi }}Gms/${{ matrix.output_type }}/*.apk
            app/build/outputs/mapping/${{ matrix.abi }}Gms${{ matrix.build_type }}/*.txt
            app/build/test-results/testUniversalGmsDebugUnitTest/*.xml
          retention-days: 7
          if-no-files-found: error
