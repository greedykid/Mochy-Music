name: CI & Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  build_debug:
    name: Build Universal GMS Debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools platforms;android-37.0 ndk;27.0.12077973
          log-accepted-android-sdk-licenses: false

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore persistent debug signing key
        env:
          DEBUG_KEYSTORE: ${{ secrets.DRIZZY_DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          if [ -n "$DEBUG_KEYSTORE" ]; then
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LIBREFM_API_KEY: ${{ secrets.LIBREFM_API_KEY }}
          LIBREFM_SECRET: ${{ secrets.LIBREFM_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          ./gradlew :app:testUniversalGmsDebugUnitTest --tests "com.mochyy.mochymusic.ui.player.drizzy.DrizzyDesignTest" assembleUniversalGmsDebug --no-configuration-cache --console=plain --warning-mode summary

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-universal-gms-debug
          path: app/build/outputs/apk/universalGms/debug/*.apk
          # a debug apk is only for trying the build, after a week it's just eating actions storage
          retention-days: 7
          if-no-files-found: error